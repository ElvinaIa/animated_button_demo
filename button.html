<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Button Border – GSAP Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                    radial-gradient(circle at 50% 35%, #183226 0%, #0d1712 35%, #070b09 75%);
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .demo {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 40px;
        }

        .animated-button {
            --accent: #47ff88;
            --angle: 0deg;

            position: relative;
            isolation: isolate;
            display: inline-grid;
            place-items: center;
            min-width: 190px;
            height: 58px;
            padding: 0 28px;
            border: 0;
            border-radius: 999px;
            background: #0c120f;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            overflow: hidden;
        }

        /* Rotating light around the border */
        .animated-button::before {
            content: "";
            position: absolute;
            z-index: -2;
            inset: -2px;
            border-radius: inherit;

            background:
                    conic-gradient(
                            from var(--angle),
                            transparent 0deg,
                            transparent 250deg,
                            rgba(71, 255, 136, 0.12) 280deg,
                            rgba(71, 255, 136, 0.95) 320deg,
                            #d6ffe4 340deg,
                            rgba(71, 255, 136, 0.15) 355deg,
                            transparent 360deg
                    );

            filter: drop-shadow(0 0 7px rgba(71, 255, 136, 0.65));
        }

        /* Inner fill masks the centre of the conic gradient */
        .animated-button::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 2px;
            border-radius: inherit;
            background:
                    linear-gradient(180deg, rgba(255,255,255,0.035), transparent),
                    #0c120f;
        }

        .animated-button__label {
            position: relative;
            z-index: 2;
        }

        .animated-button:hover {
            transform: translateY(-1px);
        }

        .animated-button:focus-visible {
            outline: 3px solid rgba(71, 255, 136, 0.42);
            outline-offset: 5px;
        }

        .animated-button--back {
            min-width: 140px;
        }

        .animated-button--back .animated-button__label::before {
            content: "←";
            display: inline-block;
            margin-right: 9px;
        }

        @media (prefers-reduced-motion: reduce) {
            .animated-button::before {
                filter: none;
            }
        }
    </style>
</head>

<body>
<div class="demo">
    <button class="animated-button" type="button">
        <span class="animated-button__label">Request Quote</span>
    </button>

    <button class="animated-button animated-button--back" type="button">
        <span class="animated-button__label">Back</span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script>
    const buttons = document.querySelectorAll(".animated-button");

    buttons.forEach((button) => {
        const label = button.querySelector(".animated-button__label");

        /*
          CSS custom properties do not animate as ordinary numeric properties,
          so we let GSAP update the conic-gradient angle manually.
        */
        const state = { angle: 0 };

        gsap.to(state, {
            angle: 360,
            duration: 2.4,
            ease: "none",
            repeat: -1,
            onUpdate: () => {
                button.style.setProperty("--angle", `${state.angle}deg`);
            }
        });

        /*
          Label alternates smoothly between white and green.
          yoyo makes the animation return to the original value.
        */
        gsap.to(label, {
            color: "#47ff88",
            duration: 1.2,
            ease: "sine.inOut",
            repeat: -1,
            yoyo: true
        });
    });

    /*
      Accessibility:
      Respect reduced-motion preference.
    */
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        gsap.globalTimeline.pause();

        document.querySelectorAll(".animated-button").forEach((button) => {
            button.style.setProperty("--angle", "320deg");
        });
    }
</script>
</body>
</html>
