<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Button Border - Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 35%, #183226 0%, #0d1712 35%, #070b09 75%);
      color: #fff;
    }

    .demo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      width: min(100%, 720px);
    }

    .animated-button {
      --angle: 0deg;

      position: relative;
      isolation: isolate;
      display: inline-grid;
      place-items: center;
      min-width: 190px;
      height: 58px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: #0c120f;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease;
    }

    .animated-button::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: -2;
      border-radius: inherit;
      background:
        conic-gradient(
          from var(--angle),
          transparent 0deg,
          transparent 250deg,
          rgba(71, 255, 136, 0.12) 280deg,
          rgba(71, 255, 136, 0.95) 320deg,
          #d6ffe4 340deg,
          rgba(71, 255, 136, 0.15) 355deg,
          transparent 360deg
        );
      filter: drop-shadow(0 0 7px rgba(71, 255, 136, 0.65));
    }

    .animated-button::after {
      content: "";
      position: absolute;
      inset: 2px;
      z-index: -1;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent),
        #0c120f;
    }

    .animated-button:hover {
      transform: translateY(-1px);
    }

    .animated-button:focus-visible {
      outline: 3px solid rgba(71, 255, 136, 0.42);
      outline-offset: 5px;
    }

    .animated-button__label {
      position: relative;
      z-index: 2;
    }

    .animated-button--back {
      min-width: 140px;
    }

    .animated-button--back .animated-button__label::before {
      content: "\2190";
      display: inline-block;
      margin-right: 9px;
    }

    @media (prefers-reduced-motion: reduce) {
      .animated-button::before {
        filter: none;
      }
    }
  </style>
</head>
<body>
  <main class="demo" aria-label="Animated button border demo">
    <button class="animated-button" type="button" data-border-button>
      <span class="animated-button__label">Request Quote</span>
    </button>

    <button class="animated-button animated-button--back" type="button" data-border-button>
      <span class="animated-button__label">Back</span>
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const borderButtons = document.querySelectorAll("[data-border-button]");

    borderButtons.forEach((button) => {
      const label = button.querySelector(".animated-button__label");
      const state = { angle: 0 };

      // GSAP drives the custom property because the conic gradient depends on it.
      const spin = gsap.to(state, {
        angle: 360,
        duration: 2.4,
        ease: "none",
        repeat: -1,
        onUpdate: () => {
          button.style.setProperty("--angle", state.angle + "deg");
        }
      });

      const pulse = gsap.to(label, {
        color: "#47ff88",
        duration: 1.2,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true
      });

      if (prefersReducedMotion) {
        spin.pause();
        pulse.pause();
        button.style.setProperty("--angle", "320deg");
        gsap.set(label, { color: "#47ff88" });
      }
    });
  </script>
</body>
</html>
